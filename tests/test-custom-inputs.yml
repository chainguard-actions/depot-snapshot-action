name: Test custom inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          image: "testorg.registry.depot.dev/myrepo:v1.0.0"
          token: ""
          base: /dev/vdb
          upper: /rw/.snap/upper
          snapshot: "/rw/overlay:/rw/.snap"
          version: latest
      - name: Assert action ran and failed gracefully with custom inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (Depot environment available)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no Depot credentials/hardware)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
