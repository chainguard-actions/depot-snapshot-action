name: Test multi-image newline-delimited input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          image: |
            testorg.registry.depot.dev/testrepo:tag1
            testorg.registry.depot.dev/testrepo:tag2
          token: "fake-depot-token"
      - name: Assert action ran and failed gracefully with multi-image input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (real Depot infra available?)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no real Depot infrastructure)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
