name: Test specific version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          image: "orgid.registry.depot.dev/repo:v1.0.0"
          token: ""
          version: "latest"
      - name: Assert action ran with version input (succeeds or fails gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with version input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no valid Depot credentials in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
